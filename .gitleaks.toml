# gitleaks 오탐(false positive) 예외 목록.
#
# 절차: 새 항목을 추가하기 전에 반드시 (1) 실제 운영/발급된 값이 아니라 테스트 픽스처·문서 예시처럼
# 코드에서 직접 만든 값인지 확인하고, (2) 정규식은 와일드카드가 아니라 그 값 "그대로"의 리터럴
# 문자열로 작성해서 다른 실제 시크릿까지 같이 가려지지 않게 하고, (3) PR 설명에 어떤 값을 왜
# 예외 처리했는지 남겨 리뷰어가 출처를 확인할 수 있게 한다. useDefault=true라 gitleaks 기본 탐지
# 룰 자체는 그대로 살아있고, 아래 목록에 없는 값은 평소처럼 다 걸린다.
title = "S15P11C203 gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known false positives: fake UUID test fixtures, not real secrets"
regexes = [
  # ReinspectionRequestControllerTests / ReinspectionRequestServiceTests / docs/api/reinspection.md에서
  # requestKey 예시로 쓴 가짜 UUID. 63708ebf 커밋에 있던 값이라 히스토리 전체 스캔에서 계속 잡힘.
  '''b3b1c7a2-3c1a-4b1a-9c1a-1a2b3c4d5e6f''',
]
