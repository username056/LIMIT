x-backend-environment: &backend-environment
  SPRING_PROFILES_ACTIVE: prod
  MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
  MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
  SPRINGDOC_API_DOCS_ENABLED: "true"
  SPRINGDOC_SWAGGER_UI_ENABLED: "true"

services:
  backend-blue:
    image: ${BACKEND_BLUE_IMAGE:?BACKEND_BLUE_IMAGE is required}
    profiles: [application]
    environment: *backend-environment
    depends_on:
      mysql: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    ports: ["127.0.0.1:8081:8080"]
    networks: [app, data]
    healthcheck: &backend-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    cpus: 1.0
    logging: &default-logging
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  backend-green:
    image: ${BACKEND_GREEN_IMAGE:?BACKEND_GREEN_IMAGE is required}
    profiles: [application]
    environment: *backend-environment
    depends_on:
      mysql: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    ports: ["127.0.0.1:8082:8080"]
    networks: [app, data]
    healthcheck: *backend-healthcheck
    mem_limit: 2g
    cpus: 1.0
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.4.1
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=8GB"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    secrets: [qdrant-api-key]
    networks: [app, data]
    mem_limit: 1g
    cpus: 0.5
    logging: *default-logging

  loki:
    image: grafana/loki:3.5.1
    profiles: [observability]
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [app]
    mem_limit: 768m
    cpus: 0.5
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.0.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: grafana.l1mit.shop
      GF_SERVER_ROOT_URL: https://grafana.l1mit.shop/
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [app]
    depends_on: [prometheus, loki]
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [observability]
    command: ["--config.file=/etc/alertmanager/config.yml"]
    volumes: ["./monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro"]
    networks: [app]
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [observability]
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]
    networks: [app]
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: [observability]
    privileged: true
    devices: ["/dev/kmsg:/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [app]
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.9.1
    profiles: [observability]
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks: [app]
    depends_on: [loki]
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    profiles: [observability]
    command: ["--config.my-cnf=/run/secrets/mysql-exporter-config"]
    secrets: [mysql-exporter-config]
    networks: [app, data]
    depends_on:
      mysql: { condition: service_healthy }
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  mongodb-exporter:
    image: percona/mongodb_exporter:0.47.1
    profiles: [observability]
    environment:
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
    command: ["--collect-all", "--compatible-mode"]
    networks: [app, data]
    depends_on:
      mongodb: { condition: service_healthy }
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    profiles: [observability]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks: [app, data]
    depends_on:
      redis: { condition: service_healthy }
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    profiles: [observability]
    command: ["--nginx.scrape-uri=http://host.docker.internal:8088/stub_status"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [app]
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  alloy-data:

secrets:
  mysql-exporter-config:
    file: ${MYSQL_EXPORTER_CONFIG_FILE:-./secrets/mysql-exporter.my.cnf.example}
  qdrant-api-key:
    file: ${QDRANT_API_KEY_FILE:-./secrets/qdrant-api-key.example}
