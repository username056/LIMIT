x-backend-environment: &backend-environment
  SPRING_PROFILES_ACTIVE: prod
  MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
  MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REFRESH_TOKEN_STORE: redis
  OAUTH_ATTEMPT_STORE: redis
  SOCIAL_SIGNUP_STORE: redis
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
  OAUTH_STATE_TTL: ${OAUTH_STATE_TTL:-10m}
  SOCIAL_SIGNUP_TTL: ${SOCIAL_SIGNUP_TTL:-15m}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  EMAIL_VERIFICATION_STORE: redis
  EMAIL_VERIFICATION_DELIVERY_ENABLED: ${EMAIL_VERIFICATION_DELIVERY_ENABLED:-false}
  EMAIL_VERIFICATION_TTL: ${EMAIL_VERIFICATION_TTL:-15m}
  FRONTEND_EMAIL_VERIFICATION_URL: ${FRONTEND_EMAIL_VERIFICATION_URL:-https://l1mit.shop/verify-email}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-no-reply@l1mit.shop}
  MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
  MAIL_STARTTLS_ENABLED: ${MAIL_STARTTLS_ENABLED:-true}
  INITIAL_ADMIN_ENABLED: ${INITIAL_ADMIN_ENABLED:-false}
  INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
  INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
  INITIAL_ADMIN_ROLE: ${INITIAL_ADMIN_ROLE:-SUPER_ADMIN}
  BASE_INIT_ENABLED: ${BASE_INIT_ENABLED:-false}
  BASE_INIT_MEMBER_ENABLED: ${BASE_INIT_MEMBER_ENABLED:-true}
  BASE_INIT_MEMBER_EMAIL: ${BASE_INIT_MEMBER_EMAIL:-}
  BASE_INIT_MEMBER_PASSWORD: ${BASE_INIT_MEMBER_PASSWORD:-}
  BASE_INIT_MEMBER_NICKNAME: ${BASE_INIT_MEMBER_NICKNAME:-}
  BASE_INIT_MEMBER_PHONE: ${BASE_INIT_MEMBER_PHONE:-}
  BASE_INIT_ADMIN_ENABLED: ${BASE_INIT_ADMIN_ENABLED:-true}
  BASE_INIT_ADMIN_EMAIL: ${BASE_INIT_ADMIN_EMAIL:-}
  BASE_INIT_ADMIN_PASSWORD: ${BASE_INIT_ADMIN_PASSWORD:-}
  BASE_INIT_ADMIN_NAME: ${BASE_INIT_ADMIN_NAME:-}
  GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URIS: ${GOOGLE_OAUTH_REDIRECT_URIS:-https://l1mit.shop/auth/callback/google}
  KAKAO_OAUTH_ENABLED: ${KAKAO_OAUTH_ENABLED:-false}
  KAKAO_OAUTH_CLIENT_ID: ${KAKAO_OAUTH_CLIENT_ID:-}
  KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET:-}
  KAKAO_OAUTH_REDIRECT_URIS: ${KAKAO_OAUTH_REDIRECT_URIS:-https://l1mit.shop/auth/callback/kakao}
  NAVER_OAUTH_ENABLED: ${NAVER_OAUTH_ENABLED:-false}
  NAVER_OAUTH_CLIENT_ID: ${NAVER_OAUTH_CLIENT_ID:-}
  NAVER_OAUTH_CLIENT_SECRET: ${NAVER_OAUTH_CLIENT_SECRET:-}
  NAVER_OAUTH_REDIRECT_URIS: ${NAVER_OAUTH_REDIRECT_URIS:-https://l1mit.shop/auth/callback/naver}
  TERMS_SERVICE_VERSION: ${TERMS_SERVICE_VERSION:-2026-07-22}
  TERMS_PRIVACY_VERSION: ${TERMS_PRIVACY_VERSION:-2026-07-22}
  TERMS_AGE_VERSION: ${TERMS_AGE_VERSION:-2026-07-22}
  TERMS_MARKETING_VERSION: ${TERMS_MARKETING_VERSION:-2026-07-22}
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
  SPRINGDOC_API_DOCS_ENABLED: "true"
  SPRINGDOC_SWAGGER_UI_ENABLED: "true"

services:
  backend-blue:
    image: ${BACKEND_BLUE_IMAGE:?BACKEND_BLUE_IMAGE is required}
    profiles: [application]
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      mysql: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    ports: ["127.0.0.1:8081:8080"]
    networks: [app, data]
    healthcheck: &backend-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    cpus: 1.0
    logging: &default-logging
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  backend-green:
    image: ${BACKEND_GREEN_IMAGE:?BACKEND_GREEN_IMAGE is required}
    profiles: [application]
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      mysql: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    ports: ["127.0.0.1:8082:8080"]
    networks: [app, data]
    healthcheck: *backend-healthcheck
    mem_limit: 2g
    cpus: 1.0
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.4.1
    profiles: [observability]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=8GB"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    secrets: [qdrant-api-key]
    networks: [app, data]
    mem_limit: 1g
    cpus: 0.5
    logging: *default-logging

  loki:
    image: grafana/loki:3.5.1
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [app]
    mem_limit: 768m
    cpus: 0.5
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.0.1
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: grafana.l1mit.shop
      GF_SERVER_ROOT_URL: https://grafana.l1mit.shop/
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [app]
    depends_on: [prometheus, loki]
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [observability]
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/config.yml"]
    volumes: ["./monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro"]
    networks: [app]
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [observability]
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]
    networks: [app]
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: [observability]
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg:/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [app]
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.9.1
    profiles: [observability]
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks: [app]
    depends_on: [loki]
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    profiles: [observability]
    restart: unless-stopped
    command: ["--config.my-cnf=/run/secrets/mysql-exporter-config"]
    secrets: [mysql-exporter-config]
    networks: [app, data]
    depends_on:
      mysql: { condition: service_healthy }
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  mongodb-exporter:
    image: percona/mongodb_exporter:0.47.1
    profiles: [observability]
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
    command: ["--collect-all", "--compatible-mode"]
    networks: [app, data]
    depends_on:
      mongodb: { condition: service_healthy }
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    profiles: [observability]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks: [app, data]
    depends_on:
      redis: { condition: service_healthy }
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    profiles: [observability]
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://host.docker.internal:8088/stub_status"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [app]
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  alloy-data:

secrets:
  mysql-exporter-config:
    file: ${MYSQL_EXPORTER_CONFIG_FILE:-./secrets/mysql-exporter.my.cnf.example}
  qdrant-api-key:
    file: ${QDRANT_API_KEY_FILE:-./secrets/qdrant-api-key.example}
