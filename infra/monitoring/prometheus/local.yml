global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: spring-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:8080]
        labels: { environment: local }

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
