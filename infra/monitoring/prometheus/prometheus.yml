global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: spring-blue
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend-blue:8080]
        labels: { color: blue }

  - job_name: spring-green
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend-green:8080]
        labels: { color: green }

  - job_name: mysql
    static_configs:
      - targets: [mysql-exporter:9104]

  - job_name: mongodb
    static_configs:
      - targets: [mongodb-exporter:9216]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
