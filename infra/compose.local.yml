x-backend-environment: &backend-environment
  SPRING_PROFILES_ACTIVE: local
  SERVER_PORT: 8080
  MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
  MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-true}
  FLYWAY_BASELINE_VERSION: ${FLYWAY_BASELINE_VERSION:-1}
  MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REFRESH_TOKEN_STORE: redis
  OAUTH_ATTEMPT_STORE: redis
  SOCIAL_SIGNUP_STORE: redis
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
  SOCIAL_SIGNUP_TTL: ${SOCIAL_SIGNUP_TTL:-15m}
  OAUTH_STATE_TTL: ${OAUTH_STATE_TTL:-10m}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  RTC_ALLOWED_ORIGIN_PATTERNS: ${RTC_ALLOWED_ORIGIN_PATTERNS:-http://localhost:5173}
  RTC_STUN_URL: ${RTC_STUN_URL:-stun:stun.l.google.com:19302}
  RTC_TURN_URL: ${RTC_TURN_URL:-turn:localhost:3478?transport=udp}
  RTC_TURN_USERNAME: ${RTC_TURN_USERNAME:-limit-local}
  RTC_TURN_CREDENTIAL: ${RTC_TURN_CREDENTIAL:-local-only-change-me}
  EMAIL_VERIFICATION_STORE: ${EMAIL_VERIFICATION_STORE:-redis}
  EMAIL_VERIFICATION_DELIVERY_ENABLED: ${EMAIL_VERIFICATION_DELIVERY_ENABLED:-false}
  EMAIL_VERIFICATION_TTL: ${EMAIL_VERIFICATION_TTL:-15m}
  FRONTEND_EMAIL_VERIFICATION_URL: ${FRONTEND_EMAIL_VERIFICATION_URL:-http://localhost:5173/verify-email}
  AUTH_RATE_LIMIT_STORE: ${AUTH_RATE_LIMIT_STORE:-redis}
  EMAIL_VERIFICATION_RATE_LIMIT_MAX_ATTEMPTS: ${EMAIL_VERIFICATION_RATE_LIMIT_MAX_ATTEMPTS:-3}
  EMAIL_VERIFICATION_RATE_LIMIT_WINDOW: ${EMAIL_VERIFICATION_RATE_LIMIT_WINDOW:-10m}
  PASSWORD_RESET_STORE: ${PASSWORD_RESET_STORE:-redis}
  PASSWORD_RESET_DELIVERY_ENABLED: ${PASSWORD_RESET_DELIVERY_ENABLED:-false}
  PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-15m}
  FRONTEND_PASSWORD_RESET_URL: ${FRONTEND_PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
  PASSWORD_RESET_RATE_LIMIT_MAX_ATTEMPTS: ${PASSWORD_RESET_RATE_LIMIT_MAX_ATTEMPTS:-3}
  PASSWORD_RESET_RATE_LIMIT_WINDOW: ${PASSWORD_RESET_RATE_LIMIT_WINDOW:-10m}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-no-reply@limit.local}
  MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
  MAIL_STARTTLS_ENABLED: ${MAIL_STARTTLS_ENABLED:-true}
  INITIAL_ADMIN_ENABLED: ${INITIAL_ADMIN_ENABLED:-false}
  INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
  INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
  INITIAL_ADMIN_ROLE: ${INITIAL_ADMIN_ROLE:-SUPER_ADMIN}
  BASE_INIT_ENABLED: ${BASE_INIT_ENABLED:-false}
  BASE_INIT_MEMBER_ENABLED: ${BASE_INIT_MEMBER_ENABLED:-true}
  BASE_INIT_MEMBER_EMAIL: ${BASE_INIT_MEMBER_EMAIL:-}
  BASE_INIT_MEMBER_PASSWORD: ${BASE_INIT_MEMBER_PASSWORD:-}
  BASE_INIT_MEMBER_NICKNAME: ${BASE_INIT_MEMBER_NICKNAME:-}
  BASE_INIT_MEMBER_PHONE: ${BASE_INIT_MEMBER_PHONE:-}
  BASE_INIT_ADMIN_ENABLED: ${BASE_INIT_ADMIN_ENABLED:-true}
  BASE_INIT_ADMIN_EMAIL: ${BASE_INIT_ADMIN_EMAIL:-}
  BASE_INIT_ADMIN_PASSWORD: ${BASE_INIT_ADMIN_PASSWORD:-}
  BASE_INIT_ADMIN_NAME: ${BASE_INIT_ADMIN_NAME:-}
  GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URIS: ${GOOGLE_OAUTH_REDIRECT_URIS:-http://localhost:5173/auth/callback/google}
  KAKAO_OAUTH_ENABLED: ${KAKAO_OAUTH_ENABLED:-false}
  KAKAO_OAUTH_CLIENT_ID: ${KAKAO_OAUTH_CLIENT_ID:-}
  KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET:-}
  KAKAO_OAUTH_REDIRECT_URIS: ${KAKAO_OAUTH_REDIRECT_URIS:-http://localhost:5173/auth/callback/kakao}
  NAVER_OAUTH_ENABLED: ${NAVER_OAUTH_ENABLED:-false}
  NAVER_OAUTH_CLIENT_ID: ${NAVER_OAUTH_CLIENT_ID:-}
  NAVER_OAUTH_CLIENT_SECRET: ${NAVER_OAUTH_CLIENT_SECRET:-}
  NAVER_OAUTH_REDIRECT_URIS: ${NAVER_OAUTH_REDIRECT_URIS:-http://localhost:5173/auth/callback/naver}
  NAVER_CLOVA_OCR_INVOKE_URL: ${NAVER_CLOVA_OCR_INVOKE_URL:-}
  NAVER_CLOVA_OCR_SECRET_KEY: ${NAVER_CLOVA_OCR_SECRET_KEY:-}
  TERMS_SERVICE_VERSION: ${TERMS_SERVICE_VERSION:-2026-07-22}
  TERMS_PRIVACY_VERSION: ${TERMS_PRIVACY_VERSION:-2026-07-22}
  TERMS_AGE_VERSION: ${TERMS_AGE_VERSION:-2026-07-22}
  TERMS_MARKETING_VERSION: ${TERMS_MARKETING_VERSION:-2026-07-22}

services:
  backend:
    build:
      context: ../backend
    environment: *backend-environment
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
    networks: [app, data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  mysql:
    ports: ["127.0.0.1:${MYSQL_PORT:-13306}:3306"]
  mongodb:
    ports: ["127.0.0.1:${MONGODB_PORT:-17017}:27017"]
  redis:
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
  coturn:
    image: coturn/coturn:4.11.0-r0
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${RTC_TURN_REALM:-limit.local}
      - --user=${RTC_TURN_USERNAME:-limit-local}:${RTC_TURN_CREDENTIAL:-local-only-change-me}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
      - --prometheus
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks: [app]
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  prometheus:
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus/local.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-local-data:/prometheus
    networks: [app]
    depends_on:
      backend:
        condition: service_healthy
      coturn:
        condition: service_started
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  loki:
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-local-data:/loki
    networks: [app]
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  grafana:
    image: grafana/grafana:12.0.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: http://localhost:3000/
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_COOKIE_SAMESITE: lax
    volumes:
      - grafana-local-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [app]
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.9.1
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-local-data:/var/lib/alloy/data
    networks: [app]
    depends_on:
      loki:
        condition: service_started
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  prometheus-local-data:
  loki-local-data:
  grafana-local-data:
  alloy-local-data:
