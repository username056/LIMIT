# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
reviews:
  profile: assertive
  auto_review:
    enabled: false
    drafts: false
    labels: [review-ready]
    base_branches: [dev, main]
    ignore_title_keywords: [WIP, "DO NOT MERGE"]
  path_filters:
    - "!**/build/**"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/package-lock.json"
    - "!backend/gradle/wrapper/gradle-wrapper.jar"
  path_instructions:
    - path: "backend/**"
      instructions: "비즈니스 규칙, 트랜잭션 경계, 동시성, API 계약, 실패 경로에 집중하고 스타일·중복은 SonarQube에 맡깁니다."
    - path: "frontend/src/**"
      instructions: "Vue 상태 전이, API 응답 계약, 로딩·빈 결과·오류 상태와 사용자 흐름의 회귀에 집중합니다."
    - path: "infra/**"
      instructions: "외부 포트 노출, Secret 유출, readiness, rollback, 자원 제한과 기존 서비스 충돌 위험을 우선 검토합니다."
