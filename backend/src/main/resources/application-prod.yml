spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/limit}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  mongodb:
    uri: ${MONGODB_URI}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

limit:
  qdrant:
    url: ${QDRANT_URL:http://qdrant:6333}

logging:
  level:
    root: INFO
    org.springframework.web: INFO

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,mongo,redis

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
