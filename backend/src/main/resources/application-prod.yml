spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/limit}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  mongodb:
    uri: ${MONGODB_URI}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

limit:
  auth:
    cookie:
      secure: true
    oauth-attempt:
      store: redis
    social-signup:
      store: redis
    email-verification:
      store: redis
      delivery-enabled: ${EMAIL_VERIFICATION_DELIVERY_ENABLED:false}
      verify-url: ${FRONTEND_EMAIL_VERIFICATION_URL}
      from: ${MAIL_FROM}
  security:
    refresh-store: redis
    jwt:
      secret: ${JWT_SECRET}
  qdrant:
    url: ${QDRANT_URL:http://qdrant:6333}

logging:
  level:
    root: INFO
    org.springframework.web: INFO

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,mongo,redis

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
