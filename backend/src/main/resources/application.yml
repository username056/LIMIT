spring:
  application:
    name: backend
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:true}
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
    validate-migration-naming: true
    clean-disabled: true

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"

limit:
  time-zone: ${APPLICATION_TIME_ZONE:Asia/Seoul}
  auth:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      social-signup-ttl: ${SOCIAL_SIGNUP_TTL:15m}
      oauth-state-ttl: ${OAUTH_STATE_TTL:10m}
    oauth-attempt:
      store: ${OAUTH_ATTEMPT_STORE:memory}
    social-signup:
      store: ${SOCIAL_SIGNUP_STORE:memory}
    terms:
      service-version: ${TERMS_SERVICE_VERSION:2026-07-22}
      privacy-version: ${TERMS_PRIVACY_VERSION:2026-07-22}
      age-version: ${TERMS_AGE_VERSION:2026-07-22}
      marketing-version: ${TERMS_MARKETING_VERSION:2026-07-22}
    oauth:
      google:
        enabled: ${GOOGLE_OAUTH_ENABLED:false}
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
        redirect-uris: ${GOOGLE_OAUTH_REDIRECT_URIS:http://localhost:5173/auth/callback/google}
      kakao:
        enabled: ${KAKAO_OAUTH_ENABLED:false}
        client-id: ${KAKAO_OAUTH_CLIENT_ID:}
        client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
        redirect-uris: ${KAKAO_OAUTH_REDIRECT_URIS:http://localhost:5173/auth/callback/kakao}
      naver:
        enabled: ${NAVER_OAUTH_ENABLED:false}
        client-id: ${NAVER_OAUTH_CLIENT_ID:}
        client-secret: ${NAVER_OAUTH_CLIENT_SECRET:}
        redirect-uris: ${NAVER_OAUTH_REDIRECT_URIS:http://localhost:5173/auth/callback/naver}
    email-verification:
      store: ${EMAIL_VERIFICATION_STORE:memory}
      delivery-enabled: ${EMAIL_VERIFICATION_DELIVERY_ENABLED:false}
      ttl: ${EMAIL_VERIFICATION_TTL:15m}
      verify-url: ${FRONTEND_EMAIL_VERIFICATION_URL:http://localhost:5173/verify-email}
      from: ${MAIL_FROM:no-reply@limit.local}
    password-reset:
      store: ${PASSWORD_RESET_STORE:memory}
      delivery-enabled: ${PASSWORD_RESET_DELIVERY_ENABLED:false}
      ttl: ${PASSWORD_RESET_TTL:15m}
      reset-url: ${FRONTEND_PASSWORD_RESET_URL:http://localhost:5173/reset-password}
    rate-limit:
      store: ${AUTH_RATE_LIMIT_STORE:memory}
      email-verification:
        max-attempts: ${EMAIL_VERIFICATION_RATE_LIMIT_MAX_ATTEMPTS:3}
        window: ${EMAIL_VERIFICATION_RATE_LIMIT_WINDOW:10m}
      password-reset:
        max-attempts: ${PASSWORD_RESET_RATE_LIMIT_MAX_ATTEMPTS:3}
        window: ${PASSWORD_RESET_RATE_LIMIT_WINDOW:10m}
  bootstrap:
    admin:
      enabled: ${INITIAL_ADMIN_ENABLED:false}
      email: ${INITIAL_ADMIN_EMAIL:}
      password: ${INITIAL_ADMIN_PASSWORD:}
      name: ${INITIAL_ADMIN_NAME:}
      role: ${INITIAL_ADMIN_ROLE:SUPER_ADMIN}
    base-init:
      enabled: ${BASE_INIT_ENABLED:false}
      member:
        enabled: ${BASE_INIT_MEMBER_ENABLED:true}
        email: ${BASE_INIT_MEMBER_EMAIL:}
        password: ${BASE_INIT_MEMBER_PASSWORD:}
        nickname: ${BASE_INIT_MEMBER_NICKNAME:}
        phone: ${BASE_INIT_MEMBER_PHONE:}
      admin:
        enabled: ${BASE_INIT_ADMIN_ENABLED:true}
        email: ${BASE_INIT_ADMIN_EMAIL:}
        password: ${BASE_INIT_ADMIN_PASSWORD:}
        name: ${BASE_INIT_ADMIN_NAME:}
  security:
    jwt:
      secret: ${JWT_SECRET:local-only-change-this-jwt-secret-32bytes}
springdoc:
  api-docs:
    enabled: false
  group-configs:
    - group: 01-auth
      packages-to-scan: com.c203.limit.domain.auth.controller
    - group: 02-member
      packages-to-scan: com.c203.limit.domain.member.controller
    - group: 03-admin
      packages-to-scan: com.c203.limit.domain.admin.controller
    - group: 04-chat
      packages-to-scan: com.c203.limit.domain.chat.controller
    - group: 05-product
      packages-to-scan: com.c203.limit.domain.product.controller
  swagger-ui:
    enabled: false
    disable-swagger-default-url: true
    doc-expansion: none
    filter: true
    tags-sorter: alpha
    operations-sorter: >-
      function (a, b) { const order = { post: 0, get: 1, patch: 2, put: 3, delete: 4 }; return (order[a.get('method')] ?? 99) - (order[b.get('method')] ?? 99); }
    urls-primary-name: 01-auth
    display-request-duration: true
