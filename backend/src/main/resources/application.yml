spring:
  application:
    name: backend
  jpa:
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"

limit:
  qdrant:
    url: ${QDRANT_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}

springdoc:
  api-docs:
    enabled: false
  group-configs:
    - group: 01-auth
      packages-to-scan: com.c203.limit.domain.auth.controller
    - group: 02-member
      packages-to-scan: com.c203.limit.domain.member.controller
    - group: 03-chat
      packages-to-scan: com.c203.limit.domain.chat.controller
  swagger-ui:
    enabled: false
    disable-swagger-default-url: true
    doc-expansion: none
    filter: true
    tags-sorter: alpha
    operations-sorter: >-
      function (a, b) { const order = { post: 0, get: 1, patch: 2, put: 3, delete: 4 }; return (order[a.get('method')] ?? 99) - (order[b.get('method')] ?? 99); }
    urls-primary-name: 01-auth
    display-request-duration: true
