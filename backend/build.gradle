plugins {
    id 'java'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.8.0'
    id 'org.owasp.dependencycheck' version '12.2.2'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.c203'
version = '0.0.1-SNAPSHOT'
description = 'Vue and Spring Boot starter backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

spotless {
    java {
        target(
                'src/main/java/com/c203/limit/domain/admin/**/*.java',
                'src/main/java/com/c203/limit/domain/auth/**/*.java',
                'src/main/java/com/c203/limit/domain/call/**/*.java',
                'src/main/java/com/c203/limit/domain/member/**/*.java',
                'src/main/java/com/c203/limit/domain/rtc/**/*.java',
                'src/main/java/com/c203/limit/domain/seller/**/*.java',
                'src/main/java/com/c203/limit/global/security/**/*.java',
                'src/main/java/com/c203/limit/global/exception/**/*.java',
                'src/main/java/com/c203/limit/global/config/SecurityConfig.java',
                'src/main/java/com/c203/limit/global/config/RtcWebSocketConfig.java',
                'src/main/java/com/c203/limit/global/config/swagger/OpenApiConfig.java'
        )
        googleJavaFormat().aosp()
        formatAnnotations()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

repositories {
    mavenCentral()
}

ext['netty.version'] = '4.2.16.Final'

dependencyCheck {
    failBuildOnCVSS = 7.0
    formats = ['HTML', 'JSON']
    data.directory = "${gradle.gradleUserHomeDir}/dependency-check-data"

    def nvdApiKey = System.getenv('NVD_API_KEY')
    if (nvdApiKey) {
        nvd.apiKey = nvdApiKey
    }
}

dependencies {
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    implementation platform('software.amazon.awssdk:bom:2.46.8')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'software.amazon.awssdk:s3'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.testcontainers:testcontainers-mongodb'
}

sourceSets {
    integrationTest {
        java.srcDir file('src/integrationTest/java')
        resources.srcDir file('src/integrationTest/resources')
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests against real engines with Testcontainers.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    def integrationSuite = providers.gradleProperty('integrationSuite').orNull
    if (integrationSuite == 'core') {
        filter {
            includeTestsMatching 'com.c203.limit.DatabaseSchemaIntegrationTests'
            includeTestsMatching 'com.c203.limit.domain.chat.repository.*'
            includeTestsMatching 'com.c203.limit.domain.payment.*'
            includeTestsMatching 'com.c203.limit.domain.product.repository.*'
        }
    } else if (integrationSuite == 'support') {
        // core에 명시적으로 포함되지 않은 현재·미래 통합 테스트를 전부 실행한다.
        // 새 테스트가 어느 shard에도 속하지 않아 조용히 누락되는 상황을 막는다.
        filter {
            excludeTestsMatching 'com.c203.limit.DatabaseSchemaIntegrationTests'
            excludeTestsMatching 'com.c203.limit.domain.chat.repository.*'
            excludeTestsMatching 'com.c203.limit.domain.payment.*'
            excludeTestsMatching 'com.c203.limit.domain.product.repository.*'
        }
    } else if (integrationSuite != null) {
        throw new GradleException("Unknown integrationSuite: ${integrationSuite}")
    }
    useJUnitPlatform {
        excludeTags 'full-infrastructure'
    }
}

tasks.register('infrastructureTest', Test) {
    description = 'Runs the full external-engine smoke test with Testcontainers.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('integrationTest')
    useJUnitPlatform {
        includeTags 'full-infrastructure'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // 단위·슬라이스 테스트에서 예약 만료 @Scheduled 자동 실행이 직접 호출과 경합하지 않도록 끈다.
    systemProperty 'limit.payment.reservation-expiration.enabled', 'false'
    // CI의 별도 openApiExport Gradle job을 없애고 이미 부팅한 계약 테스트 Context에서
    // 현재 계약을 함께 내보낸다.
    def openApiOutput = layout.buildDirectory.file('openapi/current.json').get().asFile
    systemProperty 'openapi.output', openApiOutput.absolutePath
    outputs.file(openApiOutput)
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData(
            layout.buildDirectory.file('jacoco/test.exec'),
            layout.buildDirectory.file('jacoco/integrationTest.exec')
    )
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

tasks.register('openApiExport', Test) {
    description = 'Exports the generated SpringDoc OpenAPI contract.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.c203.limit.global.config.swagger.OpenApiContractTests.exportsCurrentOpenApi'
    }

    def outputFile = providers.gradleProperty('openApiOutput')
            .orElse(layout.buildDirectory.file('openapi/current.json').map { it.asFile.absolutePath })
    systemProperty 'openapi.output', outputFile.get()
    outputs.file(outputFile)
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
