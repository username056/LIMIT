workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages: [guard, test, quality, package, deploy, verify]

default:
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

variables:
  # commit 범위 검증에 필요한 job만 job 단위에서 GIT_DEPTH: "0"으로 되돌린다.
  GIT_DEPTH: "1"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

.backend_change_template:
  rules:
    - changes: &backend_changes
        - backend/**/*
        - scripts/ci-test.sh
        - scripts/configure-sonar-quality-gate.sh
        - scripts/build-image.sh
        - scripts/bootstrap-ec2-stack.sh
        - scripts/sync-deploy-files.sh
        - scripts/deploy-remote.sh
        - scripts/deploy-blue-green.sh
        - scripts/rollback-remote.sh
        - scripts/rollback-blue-green.sh
        - scripts/rollback-blue-green.test.sh
        - scripts/smoke-test.sh
        - infra/compose.yml
        - infra/compose.prod.yml
        - .gitlab-ci.yml

# 목적별로 좁힌 변경 감지 anchor. backend_image/container_scan/deploy_prod는
# 여전히 위 backend_changes(넓은 범위)를 그대로 사용하므로 배포 안전성에는 영향이 없다.
.backend_unit_change_template:
  rules:
    - changes: &backend_unit_changes
        - backend/src/main/**/*
        - backend/src/test/**/*
        - backend/build.gradle
        - backend/settings.gradle
        - backend/gradle.properties
        - backend/gradle/wrapper/**/*
        - backend/gradlew
        - docs/api/openapi.json
        - scripts/ci-test.sh
        - scripts/export-openapi.sh
        - .gitlab-ci.yml

.backend_integration_change_template:
  rules:
    - changes: &backend_integration_changes
        - backend/src/main/**/*
        - backend/src/integrationTest/**/*
        - backend/src/main/resources/db/**/*
        - backend/build.gradle
        - backend/settings.gradle
        - backend/gradle.properties
        - backend/gradle/wrapper/**/*
        - backend/gradlew
        - scripts/ci-test.sh
        - .gitlab-ci.yml

.backend_scripts_change_template:
  rules:
    - changes: &backend_scripts_changes
        - scripts/ci-test.sh
        - scripts/apply-ec2-env.ps1
        - scripts/apply-ec2-env-remote.sh
        - scripts/apply-ec2-env-remote.test.sh
        - scripts/apply-ci-s3-env-remote.sh
        - scripts/apply-ci-s3-env-remote.test.sh
        - scripts/check-backend-logging.sh
        - scripts/check-backend-logging.test.sh
        - scripts/build-image.sh
        - scripts/sync-deploy-files.sh
        - scripts/sync-deploy-files.test.sh
        - scripts/deploy-monitoring.sh
        - scripts/deploy-monitoring-remote.sh
        - scripts/backup-datastores.sh
        - scripts/restore-backup-drill.sh
        - scripts/install-backup-cron.sh
        - scripts/test-alertmanager-notification.sh
        - scripts/operational-readiness.test.sh
        - scripts/deploy-remote.sh
        - scripts/deploy-blue-green.sh
        - scripts/rollback-remote.sh
        - scripts/rollback-blue-green.sh
        - scripts/rollback-blue-green.test.sh
        - scripts/smoke-test.sh
        - infra/compose.yml
        - infra/compose.prod.yml
        - .gitlab-ci.yml

.backend_logging_change_template:
  rules:
    - changes: &backend_logging_changes
        - backend/src/main/java/**/*
        - scripts/check-backend-logging.sh
        - scripts/check-backend-logging.test.sh
        - docs/runbook/backend-logging.md
        - .gitlab-ci.yml

.monitoring_change_template:
  rules:
    - changes: &monitoring_changes
        - infra/monitoring/**/*
        - infra/nginx/limit.conf
        - infra/compose.yml
        - infra/compose.prod.yml
        - scripts/deploy-monitoring.sh
        - scripts/deploy-monitoring-remote.sh
        - scripts/backup-datastores.sh
        - scripts/restore-backup-drill.sh
        - scripts/install-backup-cron.sh
        - scripts/test-alertmanager-notification.sh
        - scripts/operational-readiness.test.sh
        - scripts/sync-deploy-files.sh
        - scripts/sync-deploy-files.test.sh
        - .gitlab-ci.yml

.openapi_change_template:
  rules:
    - changes: &openapi_changes
        - backend/src/main/java/com/c203/limit/domain/**/controller/**/*
        - backend/src/main/java/com/c203/limit/domain/**/dto/**/*
        - backend/src/main/java/com/c203/limit/global/config/swagger/**/*
        - backend/src/main/java/com/c203/limit/global/response/**/*
        - backend/src/main/java/com/c203/limit/global/exception/**/*
        - backend/src/main/resources/application*.yml
        - backend/src/test/java/com/c203/limit/global/config/swagger/OpenApiContractTests.java
        - backend/build.gradle
        - docs/api/openapi.json
        - scripts/export-openapi.sh
        - .gitlab-ci.yml

.frontend_change_template:
  rules:
    - changes: &frontend_changes
        - frontend/**/*
        - windows-scanner/**/*
        - scripts/ci-test.sh
        - scripts/deploy-frontend.sh
        - infra/terraform/frontend/**/*
        - .gitlab-ci.yml

.backend_gradle_cache: &backend_gradle_cache
  key:
    files:
      - backend/gradle/wrapper/gradle-wrapper.properties
      - backend/gradle.properties
  paths:
    - .gradle/caches
    - .gradle/caches/build-cache-1
    - .gradle/wrapper
    - .gradle/dependency-check-data

.backend_gradle_job:
  image: gradle:9-jdk21-jammy
  cache:
    <<: *backend_gradle_cache

# 한 job만 캐시를 갱신하고 나머지는 읽기 전용으로 사용해 병렬 저장 경쟁을 막는다.
.backend_gradle_job_pull:
  image: gradle:9-jdk21-jammy
  cache:
    <<: *backend_gradle_cache
    policy: pull

.frontend_node_job:
  image: node:24-alpine
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm]
    policy: pull
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/frontend/.npm"

secret_guard:
  stage: guard
  image:
    name: zricethezav/gitleaks:v8.27.2
    entrypoint: [""]
  variables:
    # MR base나 직전 push commit부터 현재 commit까지만 검사한다. 신규 branch처럼
    # 비교 기준이 없을 때는 scripts/secret-scan.sh가 전체 이력으로 fallback한다.
    GIT_DEPTH: "0"
  script:
    - sh scripts/secret-scan.sh
    - |
      if [ "${RUN_BACKEND_LOGGING_GUARD:-false}" = "true" ]; then
        sh scripts/check-backend-logging.test.sh
        sh scripts/check-backend-logging.sh
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
      changes: *backend_logging_changes
      variables:
        RUN_BACKEND_LOGGING_GUARD: "true"
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *backend_logging_changes
      variables:
        RUN_BACKEND_LOGGING_GUARD: "true"
    - when: on_success

backend_unit_test:
  extends: .backend_gradle_job
  stage: test
  needs: []
  variables:
    # 짧은 test JVM은 C2 최적화 비용을 회수하지 못하므로 빠른 C1까지만 사용한다.
    JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1"
  script: ["sh scripts/ci-test.sh backend-unit"]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - backend/build/openapi/current.json
      - backend/build/jacoco/test.exec
    reports:
      junit: backend/build/test-results/test/TEST-*.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *backend_unit_changes
      variables:
        VERIFY_BOOT_JAR: "true"
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *backend_unit_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *backend_unit_changes

backend_integration_core_test:
  extends: .backend_gradle_job_pull
  stage: test
  needs: []
  services:
    - name: mysql:8.4
      alias: mysql
      command:
        - "--skip-log-bin"
        - "--innodb-flush-log-at-trx-commit=2"
        - "--sync-binlog=0"
  variables:
    JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1"
    MYSQL_ROOT_PASSWORD: "test-only-password"
    MYSQL_DATABASE: bootstrap
    INTEGRATION_MYSQL_JDBC_URL: "jdbc:mysql://mysql:3306"
    INTEGRATION_MYSQL_USERNAME: root
    INTEGRATION_MYSQL_PASSWORD: "test-only-password"
  script: ["sh scripts/ci-test.sh backend-integration-core"]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - backend/build/jacoco/integrationTest-core.exec
    reports:
      junit: backend/build/test-results/integrationTest/TEST-*.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *backend_integration_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *backend_integration_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *backend_integration_changes

backend_integration_support_test:
  extends: .backend_gradle_job_pull
  stage: test
  needs: []
  services:
    - name: mysql:8.4
      alias: mysql
      command:
        - "--skip-log-bin"
        - "--innodb-flush-log-at-trx-commit=2"
        - "--sync-binlog=0"
    - name: redis:7.4-alpine
      alias: redis
      command: ["redis-server", "--save", "", "--appendonly", "no"]
  variables:
    JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1"
    MYSQL_ROOT_PASSWORD: "test-only-password"
    MYSQL_DATABASE: bootstrap
    INTEGRATION_MYSQL_JDBC_URL: "jdbc:mysql://mysql:3306"
    INTEGRATION_MYSQL_USERNAME: root
    INTEGRATION_MYSQL_PASSWORD: "test-only-password"
    INTEGRATION_REDIS_HOST: redis
    INTEGRATION_REDIS_PORT: "6379"
  script: ["sh scripts/ci-test.sh backend-integration-support"]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - backend/build/jacoco/integrationTest-support.exec
    reports:
      junit: backend/build/test-results/integrationTest/TEST-*.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *backend_integration_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *backend_integration_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *backend_integration_changes

# MongoDB/Redis까지 포함한 전체 인프라 기동 검사는 일반 MR/배포의
# critical path에서 제외하고 정기 보안/의존성 검사와 함께 실행한다.
backend_infrastructure_test:
  extends: .backend_gradle_job_pull
  stage: test
  needs: []
  services:
    - name: docker:28.3.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_CHECKS_DISABLE: "true"
  script: ["sh scripts/ci-test.sh backend-infrastructure"]
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: backend/build/test-results/infrastructureTest/TEST-*.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

backend_scripts_test:
  stage: test
  needs: []
  image: bash:5.2
  script: ["sh scripts/ci-test.sh backend-scripts"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *backend_scripts_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *backend_scripts_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *backend_scripts_changes

frontend_lint:
  extends: .frontend_node_job
  stage: test
  needs: []
  script: ["sh scripts/ci-test.sh frontend-lint"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *frontend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *frontend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *frontend_changes

frontend_test:
  extends: .frontend_node_job
  stage: test
  needs: []
  script: ["sh scripts/ci-test.sh frontend-test"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *frontend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *frontend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *frontend_changes

windows_scanner_build:
  stage: test
  needs: []
  image: mcr.microsoft.com/dotnet/sdk:8.0.415
  script:
    - scanner_api_base_url="${WINDOWS_SCANNER_API_BASE_URL:-${VITE_API_BASE_URL:-http://localhost:18080/}}"
    - scanner_api_base_url="${scanner_api_base_url%/api/v1}"
    - scanner_api_base_url="${scanner_api_base_url%/}/"
    - case "$scanner_api_base_url" in http://*|https://*) ;; *) echo "WINDOWS_SCANNER_API_BASE_URL must be an absolute HTTP(S) URL" >&2; exit 1 ;; esac
    - dotnet publish windows-scanner/src/LimitScanner/LimitScanner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:LimitApiBaseUrl="$scanner_api_base_url" -o windows-scanner/artifacts
    - test -s windows-scanner/artifacts/LimitScanner.exe
  artifacts:
    expire_in: 7 days
    paths: [windows-scanner/artifacts/LimitScanner.exe]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *frontend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *frontend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *frontend_changes

frontend_build:
  stage: test
  needs:
    - job: windows_scanner_build
      artifacts: true
  image: node:24-alpine
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm]
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/frontend/.npm"
  script:
    - export VITE_SENTRY_RELEASE="${CI_COMMIT_SHA}"
    - mkdir -p frontend/public/downloads
    - cp windows-scanner/artifacts/LimitScanner.exe frontend/public/downloads/LimitScanner.exe
    - sh scripts/ci-test.sh frontend-build
  artifacts:
    expire_in: 7 days
    paths: [frontend/dist]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *frontend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *frontend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *frontend_changes

terraform_frontend_validate:
  stage: test
  needs: []
  image:
    name: hashicorp/terraform:1.13.5
    entrypoint: [""]
  variables:
    TF_IN_AUTOMATION: "true"
  script:
    - terraform -chdir=infra/terraform/frontend fmt -check -diff
    - terraform -chdir=infra/terraform/frontend init -backend=false
    - terraform -chdir=infra/terraform/frontend validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - infra/terraform/frontend/**/*

terraform_operations_validate:
  stage: test
  image:
    name: hashicorp/terraform:1.13.5
    entrypoint: [""]
  script:
    - terraform -chdir=infra/terraform/operations fmt -check -diff
    - terraform -chdir=infra/terraform/operations init -backend=false
    - terraform -chdir=infra/terraform/operations validate
  rules:
    - changes:
        - infra/terraform/operations/**/*
        - .gitlab-ci.yml

backend_coverage_report:
  extends: .backend_gradle_job_pull
  stage: quality
  needs:
    - job: backend_unit_test
      artifacts: true
      optional: true
    - job: backend_integration_core_test
      artifacts: true
      optional: true
    - job: backend_integration_support_test
      artifacts: true
      optional: true
  allow_failure: true
  script:
    - cd backend
    - ./gradlew classes jacocoTestReport -x test -x integrationTest --no-daemon
    - test -s build/reports/jacoco/test/jacocoTestReport.xml
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - backend/build/classes
      - backend/build/reports/jacoco/test/jacocoTestReport.xml
    reports:
      coverage_report:
        coverage_format: jacoco
        path: backend/build/reports/jacoco/test/jacocoTestReport.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *backend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *backend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *backend_changes

sonar_quality_gate_config:
  stage: quality
  image:
    name: curlimages/curl:8.16.0
    entrypoint: [""]
  needs: []
  allow_failure: true
  script: ["sh scripts/configure-sonar-quality-gate.sh"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *backend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *backend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *backend_changes

sonarqube:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  needs:
    - job: backend_coverage_report
      artifacts: true
      optional: true
    - job: sonar_quality_gate_config
      optional: true
  allow_failure: true
  cache:
    key: sonar
    paths: [.sonar/cache]
  variables:
    # MR의 new-code/changed-lines 계산에 target branch merge base가 필요하다.
    GIT_DEPTH: "0"
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  script: ["sh scripts/ci-quality.sh"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *backend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *backend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *backend_changes

pr_agent_review:
  stage: quality
  needs: []
  allow_failure: true
  variables:
    PARENT_MR_PROJECT_URL: "$CI_MERGE_REQUEST_PROJECT_URL"
    PARENT_MR_IID: "$CI_MERGE_REQUEST_IID"
  trigger:
    include:
      - local: .gitlab/ci/pr-agent.yml
  rules:
    - if: '$SKIP_PR_AGENT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'

dependency_check:
  extends: .backend_gradle_job
  stage: quality
  timeout: 2h
  cache:
    - key:
        files:
          - backend/gradle/wrapper/gradle-wrapper.properties
          - backend/gradle.properties
      paths:
        - .gradle/caches
        - .gradle/caches/build-cache-1
        - .gradle/wrapper
    - key: dependency-check-nvd
      paths:
        - .gradle/dependency-check-data
  script:
    - test -n "$NVD_API_KEY"
    - cd backend
    - ./gradlew dependencyCheckAnalyze --no-daemon
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - backend/build/reports/dependency-check-report.html
      - backend/build/reports/dependency-check-report.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

openapi_contract:
  stage: quality
  image:
    name: tufin/oasdiff:v1.17.0@sha256:440ea5929aafc385d040af1165b49c6264549aa0a207c8dc98edd71a7422c6ad
    entrypoint: [""]
  needs:
    - job: backend_unit_test
      artifacts: true
  script:
    - oasdiff breaking --fail-on ERR docs/api/openapi.json backend/build/openapi/current.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *openapi_changes

backend_image:
  stage: package
  image: docker:28.3.2-cli
  # Docker 다단계 빌드가 bootJar까지 수행하므로 77MB jar artifact 왕복 없이
  # 테스트와 동시에 시작한다. deploy_prod가 모든 품질 job 통과를 별도로 요구한다.
  needs: []
  services:
    - name: docker:28.3.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_REPOSITORY: "$DOCKERHUB_IMAGE"
    IMAGE_TAG: "$CI_COMMIT_SHA"
    IMAGE_ENV_FILE: image.env
    PUSH_IMAGE: "true"
    DOCKERFILE: "$CI_PROJECT_DIR/backend/Dockerfile.ci"
  before_script:
    - test -n "$DOCKERHUB_USERNAME"
    - test -n "$DOCKERHUB_TOKEN"
    - test -n "$DOCKERHUB_IMAGE"
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin docker.io
    - docker buildx create --use --name limit-builder
  script: ["sh scripts/build-image.sh"]
  artifacts:
    reports:
      dotenv: image.env
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes:
        - backend/Dockerfile.ci
        - backend/build.gradle
        - backend/settings.gradle
        - backend/gradle.properties
        - backend/gradle/wrapper/**/*
        - backend/gradlew
      variables:
        UPDATE_BUILD_CACHE: "true"
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/Dockerfile.ci
        - backend/build.gradle
        - backend/settings.gradle
        - backend/gradle.properties
        - backend/gradle/wrapper/**/*
        - backend/gradlew
      variables:
        UPDATE_BUILD_CACHE: "true"
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *backend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *backend_changes

container_scan:
  stage: package
  image:
    name: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
    entrypoint: [""]
  needs:
    - job: backend_image
      artifacts: true
  variables:
    GIT_STRATEGY: none
    # Gradle과 같은 runner 영속 볼륨을 직접 사용해 Trivy DB의 24초 복원과
    # 75초 재압축을 모두 제거한다.
    TRIVY_CACHE_DIR: "/cache/trivy-$CI_PROJECT_ID"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_USERNAME: "$DOCKERHUB_USERNAME"
    TRIVY_PASSWORD: "$DOCKERHUB_TOKEN"
  script:
    - test -n "$DEPLOY_IMAGE"
    - trivy image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --format json --output trivy-report.json "$DEPLOY_IMAGE"
  artifacts:
    when: always
    expire_in: 7 days
    paths: [trivy-report.json]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *backend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *backend_changes

deploy_prod:
  stage: deploy
  image: alpine:3.22
  interruptible: false
  resource_group: limit-prod
  needs:
    - job: secret_guard
      artifacts: false
    - job: backend_unit_test
      artifacts: false
      optional: true
    - job: backend_integration_core_test
      artifacts: false
      optional: true
    - job: backend_integration_support_test
      artifacts: false
      optional: true
    - job: backend_scripts_test
      artifacts: false
      optional: true
    - job: backend_image
      artifacts: true
    - job: container_scan
      artifacts: false
  environment:
    name: production
    url: https://grafana.l1mit.shop/
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - install -m 644 "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - install -m 600 "$DEPLOY_SSH_PRIVATE_KEY" /tmp/limit-deploy-key
    - export DEPLOY_SSH_KEY_FILE=/tmp/limit-deploy-key
    - printf '%s' "$DEPLOY_IMAGE" | grep -Eq '@sha256:[a-f0-9]{64}$'
  script:
    - sh scripts/sync-deploy-files.sh
    - sh scripts/apply-ci-s3-env-remote.sh
    - sh scripts/deploy-remote.sh prod "$DEPLOY_IMAGE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *backend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *backend_changes

monitoring_deploy_prod:
  stage: deploy
  image: alpine:3.22
  interruptible: false
  resource_group: limit-prod
  needs:
    - job: secret_guard
      artifacts: false
    - job: backend_scripts_test
      artifacts: false
      optional: true
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - install -m 644 "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - install -m 600 "$DEPLOY_SSH_PRIVATE_KEY" /tmp/limit-deploy-key
    - export DEPLOY_SSH_KEY_FILE=/tmp/limit-deploy-key
  script:
    - sh scripts/sync-deploy-files.sh monitoring
    - sh scripts/apply-ci-s3-env-remote.sh
    - sh scripts/deploy-monitoring-remote.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *monitoring_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *monitoring_changes

rollback_prod:
  stage: deploy
  image: alpine:3.22
  interruptible: false
  resource_group: limit-prod
  needs: []
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - install -m 644 "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - install -m 600 "$DEPLOY_SSH_PRIVATE_KEY" /tmp/limit-deploy-key
    - export DEPLOY_SSH_KEY_FILE=/tmp/limit-deploy-key
  script:
    - sh scripts/sync-deploy-files.sh
    - sh scripts/rollback-remote.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true

.frontend_aws_auth:
  image:
    name: public.ecr.aws/aws-cli/aws-cli:2.31.13
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - >
      aws_sts_output=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_DEPLOY_ROLE_ARN"
      --role-session-name "GitLab-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
    - set -- $aws_sts_output
    - export AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3"
    - aws sts get-caller-identity --query Arn --output text

frontend_deploy_prod:
  extends: .frontend_aws_auth
  stage: deploy
  interruptible: false
  resource_group: limit-frontend-prod
  needs:
    - job: frontend_lint
      artifacts: false
    - job: frontend_test
      artifacts: false
    - job: frontend_build
      artifacts: true
  environment:
    name: production/frontend
    url: $FRONTEND_PUBLIC_URL
  script:
    - sh scripts/deploy-frontend.sh deploy frontend/dist "$CI_COMMIT_SHA" "$FRONTEND_BUCKET_NAME" "$CLOUDFRONT_DISTRIBUTION_ID"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *frontend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *frontend_changes

frontend_rollback_prod:
  extends: .frontend_aws_auth
  stage: deploy
  interruptible: false
  resource_group: limit-frontend-prod
  environment:
    name: production/frontend
    url: $FRONTEND_PUBLIC_URL
  script:
    - test -n "$FRONTEND_ROLLBACK_RELEASE"
    - sh scripts/deploy-frontend.sh rollback "$FRONTEND_ROLLBACK_RELEASE" "$FRONTEND_BUCKET_NAME" "$CLOUDFRONT_DISTRIBUTION_ID"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true

frontend_smoke_prod:
  stage: verify
  image:
    name: curlimages/curl:8.16.0
    entrypoint: [""]
  interruptible: false
  needs: [frontend_deploy_prod]
  environment:
    name: production/frontend
    action: verify
  script:
    - test -n "$FRONTEND_PUBLIC_URL"
    - test -n "$VITE_API_BASE_URL"
    - curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$FRONTEND_PUBLIC_URL/" > /dev/null
    - api_health_url="${VITE_API_BASE_URL%/api/v1}/health"
    - curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$api_health_url" > /dev/null
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *frontend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *frontend_changes
